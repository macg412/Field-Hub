name: Deploy to Netlify

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build apps into hub
        run: |
          cp src/job-card/jobcard.html hub/apps/jobcard.html
          cp src/scoping/scoping.html hub/apps/scoping.html
          cp src/stores/storeman.html hub/apps/storeman.html
          cp src/forms/fieldforms.html hub/apps/fieldforms.html

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './hub'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: a5535789-007d-4b4a-b238-0a45d5b1a6c4
        timeout-minutes: 15
