[build]
  command = "cp src/job-card/jobcard.html hub/apps/jobcard.html && cp src/scoping/scoping.html hub/apps/scoping.html && cp src/stores/storeman.html hub/apps/storeman.html && cp src/forms/fieldforms.html hub/apps/fieldforms.html"
  publish = "hub"

# App files are built from git submodules (src/) into hub/apps/ before deploy.
# Submodules: Job-Card, Scoping-, Stores, Field-Forms (all macg412/* on GitHub).
# For Netlify-direct deploys, set GIT_SUBMODULE_STRATEGY=recursive in env vars.
# For CI deploys (GitHub Actions), submodules are checked out in the workflow.
# Supabase credentials are injected via Netlify environment variables.
# Set SUPABASE_URL and SUPABASE_ANON_KEY in the Netlify dashboard under
# Site settings → Environment variables. Do NOT commit them here.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The iframe-embedded apps (jobcard, scoping, storeman, fieldforms) are on
# the same origin, so SAMEORIGIN is safe. If you ever move them to a
# separate domain, change this to "ALLOW-FROM <other-domain>".

[[headers]]
  for = "/apps/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# fieldforms.html is 9 MB — aggressively cache it so repeat visits are fast.
[[headers]]
  for = "/apps/fieldforms.html"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
